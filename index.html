<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Apple // Discord Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --main-color: #ffffff;
      --glow-color: #ffffff;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Animation chuyển màu cực nhanh để giật theo beat */
      transition: filter 0.05s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--main-color);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Hiệu ứng Lật ngược màu toàn bộ Web theo Beat */
    body.beat-invert {
      filter: invert(100%);
    }

    /* Scanline CRT TV */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Overlay Click to Enter */
    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .enter-text {
      font-size: 1.2rem;
      letter-spacing: 3px;
      animation: pulse 1.5s infinite alternate;
      text-transform: uppercase;
      border: 1px solid #fff;
      padding: 12px 24px;
      box-shadow: 0 0 10px #fff;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* Background Matrix */
    #matrix {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      opacity: 0.15;
    }

    /* Profile Card */
    .card {
      position: relative;
      z-index: 2;
      width: 360px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid var(--main-color);
      box-shadow: 0 0 20px var(--glow-color);
      padding: 30px 20px;
      text-align: center;
      animation: card-flicker 0.15s infinite alternate;
    }

    @keyframes card-flicker {
      0% { transform: translate(0, 0); }
      98% { transform: translate(0, 0); }
      99% { transform: translate(-2px, 1px); }
      100% { transform: translate(1px, -1px); }
    }

    .avatar-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: grayscale(100%) contrast(200%);
      border: 2px solid var(--main-color);
      box-shadow: 0 0 10px var(--glow-color);
    }

    /* Glitch Text */
    .glitch {
      font-size: 1.5rem;
      font-weight: bold;
      position: relative;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--main-color);
      text-shadow: 0 0 5px var(--glow-color);
    }

    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      clip: rect(0, 0, 0, 0);
    }

    .glitch::before {
      left: -2px;
      text-shadow: 2px 0 #ff0055;
      animation: glitch-anim 2s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: 2px;
      text-shadow: -2px 0 #00f2fe;
      animation: glitch-anim2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(10px, 9999px, 30px, 0); }
      20% { clip: rect(40px, 9999px, 10px, 0); }
      40% { clip: rect(25px, 9999px, 50px, 0); }
      60% { clip: rect(70px, 9999px, 20px, 0); }
      80% { clip: rect(15px, 9999px, 80px, 0); }
      100% { clip: rect(50px, 9999px, 5px, 0); }
    }

    @keyframes glitch-anim2 {
      0% { clip: rect(60px, 9999px, 10px, 0); }
      25% { clip: rect(15px, 9999px, 70px, 0); }
      50% { clip: rect(35px, 9999px, 30px, 0); }
      75% { clip: rect(80px, 9999px, 5px, 0); }
      100% { clip: rect(5px, 9999px, 40px, 0); }
    }

    .user-tag {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 15px;
    }

    /* Player Nhạc */
    .player {
      border: 1px dashed var(--main-color);
      padding: 12px;
      margin: 20px 0;
      background: #000;
    }

    .song-info {
      font-size: 0.75rem;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      background: none;
      border: 1px solid var(--main-color);
      color: var(--main-color);
      padding: 5px 12px;
      cursor: pointer;
      font-family: var(--font-mono);
    }

    .btn:hover {
      background: var(--main-color);
      color: #000;
    }

    /* Nút Social Links */
    .socials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .social-btn {
      border: 1px solid var(--main-color);
      color: var(--main-color);
      padding: 10px;
      text-decoration: none;
      font-size: 1.2rem;
    }

    .social-btn:hover {
      background: var(--main-color);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay">
    <div class="enter-text">[ CLICK TO ENTER ]</div>
  </div>

  <canvas id="matrix"></canvas>

  <div class="card">
    <div class="avatar-container">
      <img src="https://i.imgur.com/8Km9tLL.png" alt="Avatar" class="avatar">
    </div>

    <div class="glitch" data-text="SYSTEM_FAILURE">SYSTEM_FAILURE</div>
    <div class="user-tag">@admin_root_access</div>

    <!-- Music Player -->
    <div class="player">
      <div class="song-info">> Anybody can find love [Glitch Cat Remix]</div>
      <div class="controls">
        <button class="btn" id="play">[PAUSE]</button>
      </div>
      <!-- File audio phát trực tiếp để phân tích Beat -->
      <audio id="audio" crossorigin="anonymous" loop src="https://files.catbox.moe/k854b4.mp3"></audio>
    </div>

    <!-- Social Links -->
    <div class="socials">
      <a href="https://youtube.com" target="_blank" class="social-btn"><i class="fab fa-youtube"></i></a>
      <a href="https://facebook.com" target="_blank" class="social-btn"><i class="fab fa-facebook"></i></a>
      <a href="https://zalo.me" target="_blank" class="social-btn"><i class="fas fa-comment"></i></a>
      <a href="https://discord.com" target="_blank" class="social-btn"><i class="fab fa-discord"></i></a>
      <a href="https://t.me" target="_blank" class="social-btn"><i class="fab fa-telegram"></i></a>
      <a href="https://github.com" target="_blank" class="social-btn"><i class="fab fa-github"></i></a>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');

    let audioCtx, analyser, dataArray;

    // 1. CLICK TO ENTER & KÍCH HOẠT BEAT DETECTOR
    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      
      // Khởi tạo Web Audio API để đo nhịp Bass/Beat
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        analyser.fftSize = 64; // Chia dải tần số
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }

      audioCtx.resume();
      audio.play();
      detectBeat();
    });

    // 2. PHÂN TÍCH NHỊP BASS & CONTRAST FLIP (INVERT)
    function detectBeat() {
      requestAnimationFrame(detectBeat);
      if (audio.paused) return;

      analyser.getByteFrequencyData(dataArray);
      
      // Lấy năng lượng ở dải âm trầm (Bass / Kick Beat)
      let bassSum = 0;
      for (let i = 0; i < 4; i++) {
        bassSum += dataArray[i];
      }
      let bassAverage = bassSum / 4;

      // Nếu tiếng Beat nổ mạnh (vượt ngưỡng 205), lật ngược màu web
      if (bassAverage > 205) {
        document.body.classList.add('beat-invert');
      } else {
        document.body.classList.remove('beat-invert');
      }
    }

    // Nút Play/Pause
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerText = "[PAUSE]";
      } else {
        audio.pause();
        playBtn.innerText = "[PLAY]";
      }
    });

    // 3. EFFECT HACKER MATRIX BACKGROUND
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = "01010101GLITCHHACKERROR";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);
  </script>
</body>
</html>
