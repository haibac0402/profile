<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat Sync Invert - Glitch Cat Remix</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --text-color: #ffffff;
      --accent-color: #ff2a6d;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.05s ease, filter 0.05s ease;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Hiệu ứng lật ngược màu sắc toàn trang */
    body.inverted {
      filter: invert(100%) hue-rotate(180deg);
    }

    .container {
      text-align: center;
      z-index: 10;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #888;
      margin-bottom: 30px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
    }

    #youtube-player {
      width: 100%;
      height: 100%;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Anybody Can Find Love (Except You.)</h1>
    <p>[Glitch Cat Remix] - Visualizer Beat Sync</p>

    <div class="player-wrapper">
      <div id="youtube-player"></div>
    </div>

    <div class="controls">
      <button id="start-btn">Kích hoạt Audio Visualizer & Phát</button>
    </div>
  </div>

  <script>
    // Load YouTube API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var audioCtx, analyser, dataArray;
    var isPlaying = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        videoId: 'sG4ZMsi6djs',
        playerVars: {
          'playsinline': 1,
          'controls': 1
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        detectBeatSimulated(); // Chạy bộ giả lập nhịp nếu API Web Audio bị giới hạn bởi Iframe
      } else {
        isPlaying = false;
      }
    }

    // Thiết lập tính năng lật màu dựa trên nhịp điệu (BPM / Frequency pulse)
    var lastFlip = 0;
    var bpm = 128; // Tốc độ BPM ước tính của bài hát
    var beatInterval = (60 / bpm) * 1000;

    function detectBeatSimulated() {
      if (!isPlaying) return;

      var now = Date.now();
      if (now - lastFlip > beatInterval / 2) {
        document.body.classList.toggle('inverted');
        lastFlip = now;
      }

      requestAnimationFrame(detectBeatSimulated);
    }

    document.getElementById('start-btn').addEventListener('click', function() {
      if (player && player.playVideo) {
        player.playVideo();
      }
    });
  </script>
</body>
</html>
