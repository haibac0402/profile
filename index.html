<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItsVenuz // Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #09090b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(120, 119, 198, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .enter-btn {
      font-size: 0.95rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 380px;
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 24px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
    }

    .avatar-decoration {
      position: absolute;
      top: -5px;
      left: -5px;
      width: 120px;
      height: 120px;
      pointer-events: none;
      z-index: 2;
    }

    .status-dot {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 18px; height: 18px;
      background-color: #80848e;
      border: 3.5px solid #121216;
      border-radius: 50%;
      z-index: 3;
    }

    .status-dot.online { background-color: #23a55a; }
    .status-dot.idle { background-color: #f0b232; }
    .status-dot.dnd { background-color: #f23f43; }
    .status-dot.offline { background-color: #80848e; }

    .display-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .username {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 2px;
      margin-bottom: 20px;
    }

    .music-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .music-info {
      flex: 1;
      text-align: left;
      overflow: hidden;
    }

    .song-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="enter-btn">[ click to enter ]</div>
  </div>

  <div class="bg-glow"></div>

  <div class="card">
    <div class="avatar-wrapper">
      <img id="discord-avatar" src="" class="avatar" style="display: none;">
      <img id="discord-frame" class="avatar-decoration" style="display: none;">
      <div id="discord-status" class="status-dot"></div>
    </div>

    <div id="discord-name" class="display-name">...</div>
    <div id="discord-tag" class="username">@...</div>

    <div class="music-box">
      <i class="fas fa-music"></i>
      <div class="music-info">
        <div class="song-title">Anybody can find love (except you.)</div>
        <div class="song-artist">Glitch Cat Remix</div>
      </div>
    </div>

    <div class="social-grid">
      <a href="https://facebook.com" target="_blank" class="social-btn"><i class="fab fa-facebook"></i></a>
      <a href="https://zalo.me" target="_blank" class="social-btn"><i class="fas fa-comment"></i></a>
      <a href="https://discord.com" target="_blank" class="social-btn"><i class="fab fa-discord"></i></a>
      <a href="https://t.me" target="_blank" class="social-btn"><i class="fab fa-telegram"></i></a>
      <a href="https://github.com" target="_blank" class="social-btn"><i class="fab fa-github"></i></a>
      <a href="https://youtube.com" target="_blank" class="social-btn"><i class="fab fa-youtube"></i></a>
    </div>
  </div>

  <audio id="bg-audio" loop src="music.mp3"></audio>

  <script>
    const DISCORD_ID = "993081831811997706";

    const overlay = document.getElementById('overlay');
    const audio = document.getElementById('bg-audio');

    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      audio.play().catch(e => console.log(e));
    });

    // Real-time WebSocket connection to Lanyard
    function connectLanyard() {
      const ws = new WebSocket("wss://api.lanyard.rest/socket");

      ws.onopen = () => {
        ws.send(JSON.stringify({
          op: 2,
          d: { subscribe_to_id: DISCORD_ID }
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.t === "INIT_STATE" || data.t === "PRESENCE_UPDATE") {
          updateProfile(data.d);
        }
      };

      ws.onclose = () => setTimeout(connectLanyard, 3000);
    }

    function updateProfile(presence) {
      const user = presence.discord_user;
      const status = presence.discord_status;

      // 1. Display Name & Username Tag
      document.getElementById('discord-name').innerText = user.global_name || user.username;
      document.getElementById('discord-tag').innerText = `@${user.username}`;

      // 2. Avatar (Animated GIF vs Static PNG)
      const avatarImg = document.getElementById('discord-avatar');
      if (user.avatar) {
        const isGif = user.avatar.startsWith("a_");
        avatarImg.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${isGif ? 'gif' : 'png'}?size=256`;
        avatarImg.style.display = "block";
      }

      // 3. Avatar Decoration (Frame)
      const frameImg = document.getElementById('discord-frame');
      if (user.avatar_decoration_data) {
        const asset = user.avatar_decoration_data.asset;
        frameImg.src = `https://cdn.discordapp.com/avatar-decorations/${user.id}/${asset}.png`;
        frameImg.style.display = "block";
      } else {
        frameImg.style.display = "none";
      }

      // 4. Status Dot
      document.getElementById('discord-status').className = `status-dot ${status}`;
    }

    connectLanyard();
  </script>
</body>
</html>
